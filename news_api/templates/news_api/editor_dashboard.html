{% extends "news_api/base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Editor Control Center</h2>
    
    <h4 class="text-warning">Pending Approval</h4>
    <div id="pending-list" class="row mb-5"></div>

    <hr>

    <h4 class="text-success">Live Articles & Newsletters</h4>
    <div id="published-list" class="row"></div>
</div>

<script>
    async function loadDashboard() {
        const response = await fetch('/api/articles/');
        const articles = await response.json();
        
        // Split data into two buckets
        const pending = articles.filter(a => !a.is_approved);
        const published = articles.filter(a => a.is_approved);
        
        renderList(pending, 'pending-list', true);    // true = show Approve button
        renderList(published, 'published-list', false); // false = hide Approve button
    }

    function renderList(items, containerId, showApprove) {
        const container = document.getElementById(containerId);
        container.innerHTML = items.length ? '' : '<p class="text-muted ms-3">No content in this category.</p>';

        items.forEach(article => {
            const approveBtn = showApprove 
                ? `<button onclick="approveArticle(${article.id})" class="btn btn-success">Approve</button>` 
                : '';

            container.innerHTML += `
                <div class="col-12 mb-3">
                    <div class="card shadow-sm ${showApprove ? 'border-warning' : 'border-success'}">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1">${article.title}</h5>
                                <small class="text-muted">By ${article.author_name} | ${article.content_type.toUpperCase()}</small>
                            </div>
                            <div class="btn-group">
                                ${approveBtn}
                                <a href="/edit-article/${article.id}/" class="btn btn-outline-primary">Edit</a>
                                <button onclick="deleteArticle(${article.id})" class="btn btn-outline-danger">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // Reuse of existing approve/delete functions below...
    async function approveArticle(id) {
        const response = await fetch(`/api/articles/${id}/`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({ is_approved: true })
        });
        if (response.ok) loadDashboard();
    }

    async function deleteArticle(id) {
        if (!confirm("Delete this permanently?")) return;
        const response = await fetch(`/api/articles/${id}/`, {
            method: 'DELETE',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        if (response.ok) loadDashboard();
    }

    // Call the main function
    loadDashboard();
</script>
{% endblock %}
