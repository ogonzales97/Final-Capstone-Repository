{% extends "news_api/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-4">Submit a New Story</h2>
                <form id="article-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Headline</label>
                        <input type="text" id="title" class="form-control form-control-lg" placeholder="Enter a catchy title..." required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Select Publisher</label>
                        <select id="publisher" class="form-select" required>
                            <option value="">Choose your organization</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Article Content</label>
                        <textarea id="content" class="form-control" rows="12" placeholder="Write your story here..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="content_type" class="form-label">Content Type</label>
                        <select class="form-select" id="content_type">
                            <option value="article" selected>Article</option>
                            <option value="newsletter">Newsletter</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">Submit for Editor Review</button>
                    </div>
                </form>
                <div id="response-msg" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Fetch publishers to fill the dropdown
    async function getPublishers() {
        const res = await fetch('/api/publishers/');
        const data = await res.json();
        const select = document.getElementById('publisher');
        data.forEach(pub => {
            select.innerHTML += `<option value="${pub.id}">${pub.name}</option>`;
        });
    }

    // Handle the submission
    document.getElementById('article-form').onsubmit = async (e) => {
        e.preventDefault();
        
        const payload = {
            title: document.getElementById('title').value,
            content: document.getElementById('content').value,
            publisher: document.getElementById('publisher').value,
            content_type: document.getElementById('content_type').value,
            author: {{ user.id }} // Using Django template tag to get current user ID
        };

        const response = await fetch('/api/articles/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(payload)
        });

        const msgDiv = document.getElementById('response-msg');
        if (response.ok) {
            msgDiv.innerHTML = `<div class="alert alert-success">Success! Your article has been sent to the editors.</div>`;
            document.getElementById('article-form').reset();
        } else {
            const errorData = await response.json();
            msgDiv.innerHTML = `<div class="alert alert-danger">Error: ${JSON.stringify(errorData)}</div>`;
        }
    };

    getPublishers();
</script>
{% endblock %}
