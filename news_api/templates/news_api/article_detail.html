{% extends "news_api/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div id="article-detail">
            <div class="text-center mt-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Loading article...</p>
            </div>
        </div>
        <hr>
        <a href="/" class="btn btn-secondary">Back to News</a>
    </div>
</div>

<script>
    async function loadArticleDetail() {
        const id = "{{ article_id }}";  // Get the article ID passed from the view

        try {
            // Fetch Article Data
            const response = await fetch(`/api/articles/${id}/`);
            if (!response.ok) throw new Error('Article not found');
            const article = await response.json();
            
            // Fetch User Subscriptions
            let isSubscribed = false;
            const subCheckRes = await fetch('/api/subscriptions/');
            if (subCheckRes.ok) {
                const subs = await subCheckRes.json();
                // Check if any of my subscriptions match this article's publisher
                const articlePubId = (article.publisher && typeof article.publisher === 'object') ? article.publisher.id : article.publisher;
                isSubscribed = subs.some(s => Number(s.publisher) === Number(articlePubId));
            }

            const container = document.getElementById('article-detail');
            const pId = (article.publisher && typeof article.publisher === 'object') ? article.publisher.id : article.publisher;

            // Render HTML with the correct button state
            container.innerHTML = `
                <h1 class="display-4 mb-3">${article.title}</h1>
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                    <div>
                        <span class="text-muted">By <strong>${article.author_name}</strong></span>
                        <span class="mx-2">|</span>
                        <span class="text-muted">Publisher: <strong>${article.publisher_name}</strong></span>
                    </div>
                    {% if user.is_authenticated %}
                    <button id="subscribe-btn" 
                        class="btn ${isSubscribed ? 'btn-success' : 'btn-outline-primary'} btn-sm" 
                        data-publisher="${pId}" 
                        ${isSubscribed ? 'disabled' : ''}>
                         ${isSubscribed ? 'Already Subscribed' : 'Subscribe to ' + article.publisher_name}
                    </button>
                    {% endif %}
                </div>
                <div class="lead" style="white-space: pre-wrap;">${article.content}</div>
            `;

            // Keep the click logic as a backup
            const subBtn = document.getElementById('subscribe-btn');
            if (subBtn && !isSubscribed) {
                subBtn.onclick = async () => {
                    const pubId = subBtn.getAttribute('data-publisher');
                    const subRes = await fetch('/api/subscriptions/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({ publisher: parseInt(pubId) })
                    });

                    if (subRes.ok || subRes.status === 400) {
                        subBtn.className = 'btn btn-success btn-sm';
                        subBtn.innerHTML = 'Subscribed';
                        subBtn.disabled = true;
                    }
                };
            }
        } catch (error) {
            console.error("Load error:", error);
        }
    }
    loadArticleDetail();
</script>
{% endblock %}
